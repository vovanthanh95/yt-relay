<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- QUAN TRỌNG: gửi referer hợp lệ để tránh YouTube Error 153 -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Relay</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
  #player { width: 100%; height: 100%; }
  #unmute {
    position: fixed; left: 8px; bottom: 8px; z-index: 10;
    background: rgba(0,0,0,.78); color: #fff; border: 1px solid rgba(255,255,255,.7);
    border-radius: 20px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  #unmute:hover { background: rgba(0,0,0,.95); }
  .msg { color: #aaa; padding: 16px; font-size: 13px; }
</style>
</head>
<body>
<div id="player"></div>
<button id="unmute" style="display:none">🔊 Bật tiếng</button>
<script>
  var q = new URLSearchParams(location.search);
  var v = q.get("v");
  var list = q.get("list");
  var start = parseInt(q.get("start") || "0", 10) || 0;

  if (!v && !list) {
    document.body.innerHTML = '<div class="msg">Thiếu tham số ?v=VIDEO_ID</div>';
  } else {
    var tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  }

  var player;
  window.onYouTubeIframeAPIReady = function () {
    // Tắt tiếng để trình duyệt/webview cho phép tự phát (muted autoplay luôn được phép)
    var vars = { autoplay: 1, mute: 1, rel: 0, modestbranding: 1, playsinline: 1 };
    if (start) vars.start = start;
    if (list) vars.list = list;

    var opts = { width: "100%", height: "100%", playerVars: vars, events: { onReady: onReady } };
    if (v) {
      opts.videoId = v;
    } else {
      opts.playerVars.listType = "playlist";
    }
    player = new YT.Player("player", opts);
  };

  function onReady(e) {
    e.target.playVideo();
    var btn = document.getElementById("unmute");
    btn.style.display = "block";
    btn.addEventListener("click", function () {
      e.target.unMute();
      e.target.setVolume(100);
      e.target.playVideo();
      btn.style.display = "none";
    });
  }
</script>
</body>
</html>
